name: Lean verification
on:
  push:
    branches: [main, palomar]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b
        with:
          ruby-version: "3.3.12"
      - name: Check source layout and interface freshness
        run: |
          python3 scripts/check-lean-sources.py
          python3 scripts/generate-palomar-interface.py --check
          ruby scripts/validate-formalization.rb
      - name: Install exact Lean release
        shell: bash
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0-rc2/lean-4.35.0-rc2-linux.tar.zst \
            --output "$RUNNER_TEMP/lean.tar.zst"
          printf '%s  %s\n' \
            b67d0e0ba959fc74e186f1b44aebca32d6ecb6a28f8e9a029fc4e9f73398a049 \
            "$RUNNER_TEMP/lean.tar.zst" | sha256sum --check
          tar --no-same-owner --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.35.0-rc2-linux/bin" >> "$GITHUB_PATH"
      - name: Compile libraries and independent interfaces
        run: |
          lake exe cache get
          lake build
          lake env lean SemanticWitnesses.lean
          lake env lean RP3SemanticWitnesses.lean
          lake env lean PalomarAxioms.lean
